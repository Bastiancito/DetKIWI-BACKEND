version: '3.8'

services:
  web:
    build: .
    command: python run.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - USE_PROD_ENV=false
      - DATABASE_URL_DEV=postgresql://kiwi_user:kiwi_pass@db:5432/kiwi_db
      - JWT_ACCESS_TOKEN_EXPIRES_MINUTES=20160
      - JWT_REFRESH_TOKEN_EXPIRES_DAYS=7
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: kiwi_user
      POSTGRES_PASSWORD: kiwi_pass
      POSTGRES_DB: kiwi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: